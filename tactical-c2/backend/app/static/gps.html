<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone GPS Node</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root { --bg:#0f1412; --panel:#18201c; --line:#2b3831; --fg:#e4ece6; --dim:#8fa197;
          --ok:#5fd38d; --warn:#f0b54a; --bad:#ef6a5a; --acc:#62b6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.04em; flex:1; }
  #map { height:42vh; min-height:240px; background:#1d2622; }
  main { padding:12px 16px 28px; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  input, button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:10px 12px; }
  input { width:90px; }
  button { flex:1; cursor:pointer; }
  button.primary { background:#1f5c3a; border-color:#2f8a57; font-weight:600; }
  button.stop { background:#5c2420; border-color:#8a362f; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .cell .k { color:var(--dim); font-size:12px; }
  .cell .v { font:600 19px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all; }
  .cell .s { color:var(--dim); font-size:12px; }
  .wide { grid-column:1 / -1; }
  .pill { font-size:12px; padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .pill.bad { color:var(--bad); border-color:var(--bad); }
  #msg { margin:10px 0 0; font-size:13px; color:var(--warn); white-space:pre-line; }
  .arrow { width:30px; height:30px; transform-origin:50% 50%; }
</style>
</head>
<body>
<header>
  <h1>PHONE GPS NODE</h1>
  <span id="netPill" class="pill">IDLE</span>
</header>
<div id="map"></div>
<main>
  <div class="row">
    <input id="dev" value="P1" maxlength="32" aria-label="Device ID">
    <button id="startBtn" class="primary">측정 시작</button>
    <button id="csvBtn">CSV</button>
  </div>
  <div class="grid">
    <div class="cell"><div class="k">위도 (lat)</div><div class="v" id="lat">—</div></div>
    <div class="cell"><div class="k">경도 (lon)</div><div class="v" id="lon">—</div></div>
    <div class="cell"><div class="k">정확도 (accuracy)</div><div class="v" id="acc">—</div><div class="s" id="accQ"></div></div>
    <div class="cell"><div class="k">방위각 (heading)</div><div class="v" id="hdg">—</div><div class="s" id="hdgSrc"></div></div>
    <div class="cell"><div class="k">나침반 (compass)</div><div class="v" id="cmp">—</div><div class="s" id="cmpS"></div></div>
    <div class="cell"><div class="k">GPS 진행방향 / 속도</div><div class="v" id="crs">—</div><div class="s" id="spd"></div></div>
    <div class="cell wide"><div class="k">전송</div><div class="s" id="tx">미시작</div></div>
  </div>
  <p id="msg"></p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SEND_INTERVAL_MS = 1000;      // 1 Hz, same as firmware GpsPacket
const QUEUE_MAX = 900;              // ~15 min of fixes kept while the laptop is unreachable
const MOVING_MPS = 1.0;             // above this, GNSS course is trusted over the compass

const st = { watchId:null, compass:null, compassAcc:null, last:null, lastSent:0,
             queue:[], log:[], sent:0, failed:0, wakeLock:null, follow:true };

// ---------------------------------------------------------------- map (OSM)
let map = null, marker = null, accCircle = null, trail = null;
function initMap() {
  if (!window.L) { note("지도 라이브러리를 불러오지 못했습니다(오프라인). 측정·전송은 계속됩니다."); return; }
  map = L.map("map", { zoomControl:true }).setView([37.5665, 126.9780], 16);
  const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
  tiles.on("tileerror", () => note("OSM 타일을 받지 못했습니다(인터넷 없음). 좌표는 정상 측정됩니다."));
  tiles.addTo(map);
  const icon = L.divIcon({ className:"", iconSize:[30,30], iconAnchor:[15,15],
    html:'<svg class="arrow" id="arrow" viewBox="0 0 30 30"><circle cx="15" cy="15" r="6" fill="#62b6ff" stroke="#fff" stroke-width="2"/><path d="M15 1 L20 11 L10 11 Z" fill="#62b6ff" stroke="#fff" stroke-width="1"/></svg>' });
  marker = L.marker([0,0], { icon, interactive:false });
  accCircle = L.circle([0,0], { radius:1, color:"#62b6ff", weight:1, fillOpacity:.12 });
  trail = L.polyline([], { color:"#5fd38d", weight:3, opacity:.8 });
  map.on("dragstart", () => { st.follow = false; });
}
function updateMap(f, heading) {
  if (!map) return;
  const ll = [f.lat, f.lon];
  if (!map.hasLayer(marker)) { marker.addTo(map); accCircle.addTo(map); trail.addTo(map); map.setView(ll, 18); }
  marker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(f.accuracy_m);
  trail.addLatLng(ll);
  const a = document.getElementById("arrow");
  if (a) { a.style.transform = `rotate(${heading ?? 0}deg)`; a.style.opacity = heading == null ? .35 : 1; }
  if (st.follow) map.panTo(ll, { animate:false });
}

// ------------------------------------------------------------- compass
function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onAbsOrientation(e) {                    // Android Chrome: deviceorientationabsolute
  if (e.alpha == null) return;
  st.compass = (360 - e.alpha + screenAngle()) % 360;
}
function onIosOrientation(e) {                    // iOS Safari: webkitCompassHeading (already clockwise from north)
  if (e.webkitCompassHeading == null) return;
  st.compass = (e.webkitCompassHeading + screenAngle()) % 360;
  st.compassAcc = e.webkitCompassAccuracy ?? null;
}
async function startCompass() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try {                                          // iOS 13+: must be called from a user gesture
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== "granted") { note("나침반 권한이 거부되었습니다. 방위각은 이동 중 GPS 진행방향만 사용합니다."); return; }
    } catch (err) { note("나침반 권한 요청 실패: " + err.message); return; }
    window.addEventListener("deviceorientation", onIosOrientation, true);
  } else if ("ondeviceorientationabsolute" in window) {
    window.addEventListener("deviceorientationabsolute", onAbsOrientation, true);
  } else {
    note("이 브라우저는 절대 방위(나침반)를 제공하지 않습니다. 이동 중 GPS 진행방향만 사용합니다.");
  }
}
function stopCompass() {
  window.removeEventListener("deviceorientation", onIosOrientation, true);
  window.removeEventListener("deviceorientationabsolute", onAbsOrientation, true);
}

// ------------------------------------------------------------- geolocation
function onPosition(pos) {
  const c = pos.coords;
  const f = {
    device_id: $("dev").value.trim() || "P1",
    fix_unix_ms: Math.round(pos.timestamp),
    lat: c.latitude, lon: c.longitude, accuracy_m: c.accuracy,
    heading_gps_deg: Number.isFinite(c.heading) ? c.heading : null,
    heading_compass_deg: st.compass == null ? null : Math.round(st.compass * 10) / 10,
    compass_accuracy_deg: st.compassAcc,
    speed_mps: Number.isFinite(c.speed) ? c.speed : null,
    alt_m: Number.isFinite(c.altitude) ? c.altitude : null,
    alt_accuracy_m: Number.isFinite(c.altitudeAccuracy) ? c.altitudeAccuracy : null,
  };
  const moving = f.speed_mps != null && f.speed_mps >= MOVING_MPS;
  let heading = null, src = "없음";
  if (moving && f.heading_gps_deg != null) { heading = f.heading_gps_deg; src = "GPS 진행방향 (이동 중)"; }
  else if (f.heading_compass_deg != null) { heading = f.heading_compass_deg; src = "나침반"; }
  else if (f.heading_gps_deg != null) { heading = f.heading_gps_deg; src = "GPS 진행방향"; }
  st.last = f;
  render(f, heading, src);
  updateMap(f, heading);
  const now = Date.now();
  if (now - st.lastSent >= SEND_INTERVAL_MS) { st.lastSent = now; enqueue(f); }
}
function onPosError(err) {
  const why = { 1:"위치 권한 거부", 2:"위치 확인 불가(실내/신호 약함)", 3:"응답 시간 초과" }[err.code] || err.message;
  note("GPS 오류: " + why);
  pill(err.code === 1 ? "bad" : "warn", err.code === 1 ? "NO PERMISSION" : "NO FIX");
}

// ------------------------------------------------------------- transmit
function enqueue(f) {
  st.log.push(f);
  st.queue.push(f);
  if (st.queue.length > QUEUE_MAX) st.queue.splice(0, st.queue.length - QUEUE_MAX);
  flush();
}
let flushing = false;
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    while (st.queue.length) {
      const f = st.queue[0];
      const r = await fetch("/api/gps", { method:"POST", headers:{ "Content-Type":"application/json" },
                                           body:JSON.stringify(f), cache:"no-store" });
      if (r.status === 422) { st.queue.shift(); st.failed++; continue; }   // invalid fix: drop, keep going
      if (!r.ok) throw new Error("HTTP " + r.status);
      st.queue.shift(); st.sent++;
    }
    pill("ok", "LIVE");
  } catch (e) {
    pill("warn", "BUFFERING");
  } finally {
    flushing = false;
    $("tx").textContent = `전송 ${st.sent} · 대기 ${st.queue.length} · 무효 ${st.failed} · 로컬기록 ${st.log.length}`;
  }
}
setInterval(() => { if (st.watchId != null && st.queue.length) flush(); }, 3000);

// ------------------------------------------------------------- UI
function fmt(v, d) { return v == null ? "—" : v.toFixed(d); }
function render(f, heading, src) {
  $("lat").textContent = f.lat.toFixed(7);
  $("lon").textContent = f.lon.toFixed(7);
  $("acc").textContent = f.accuracy_m.toFixed(1) + " m";
  $("accQ").textContent = f.accuracy_m <= 10 ? "양호" : f.accuracy_m <= 30 ? "보통" : "낮음 — 실외·하늘 개방 위치 권장";
  $("hdg").textContent = heading == null ? "—" : heading.toFixed(1) + "°";
  $("hdgSrc").textContent = src;
  $("cmp").textContent = f.heading_compass_deg == null ? "—" : f.heading_compass_deg.toFixed(1) + "°";
  $("cmpS").textContent = st.compassAcc != null ? `±${st.compassAcc}°` : "기기 상단 기준";
  $("crs").textContent = f.heading_gps_deg == null ? "—" : f.heading_gps_deg.toFixed(1) + "°";
  $("spd").textContent = f.speed_mps == null ? "속도 —" : `${fmt(f.speed_mps, 2)} m/s`;
}
function note(t) { $("msg").textContent = t; }
function pill(cls, t) { const p = $("netPill"); p.className = "pill " + cls; p.textContent = t; }

async function start() {
  note("");
  if (!window.isSecureContext) {
    note("HTTPS가 아니어서 브라우저가 위치 접근을 막습니다.\nhttps://<노트북IP>:8443/gps 로 접속하세요 (README 참고).");
    pill("bad", "NOT HTTPS");
    return;
  }
  if (!("geolocation" in navigator)) { note("이 브라우저는 Geolocation을 지원하지 않습니다."); return; }
  await startCompass();
  st.watchId = navigator.geolocation.watchPosition(onPosition, onPosError,
    { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
  try { st.wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) { /* optional */ }
  st.follow = true;
  pill("warn", "WAIT FIX");
  $("startBtn").textContent = "측정 중지"; $("startBtn").className = "stop";
  $("dev").disabled = true;
}
function stop() {
  if (st.watchId != null) navigator.geolocation.clearWatch(st.watchId);
  st.watchId = null;
  stopCompass();
  st.wakeLock?.release?.(); st.wakeLock = null;
  pill("", "IDLE");
  $("startBtn").textContent = "측정 시작"; $("startBtn").className = "primary";
  $("dev").disabled = false;
}
$("startBtn").addEventListener("click", () => (st.watchId == null ? start() : stop()));
$("csvBtn").addEventListener("click", () => {
  const cols = ["device_id","fix_unix_ms","lat","lon","accuracy_m","heading_gps_deg","heading_compass_deg",
                "compass_accuracy_deg","speed_mps","alt_m","alt_accuracy_m"];
  const lines = [cols.join(",")].concat(st.log.map((f) => cols.map((k) => f[k] ?? "").join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type:"text/csv" }));
  a.download = `gps_${$("dev").value || "P1"}_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;
  a.click();
});
document.addEventListener("visibilitychange", async () => {   // wake lock is dropped when the tab is hidden
  if (document.visibilityState === "visible" && st.watchId != null && (!st.wakeLock || st.wakeLock.released)) {
    try { st.wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
  }
});
initMap();
</script>
</body>
</html>
