<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone GPS Node</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root { --bg:#0f1412; --panel:#18201c; --line:#2b3831; --fg:#e4ece6; --dim:#8fa197;
          --ok:#5fd38d; --warn:#f0b54a; --bad:#ef6a5a; --acc:#62b6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.04em; flex:1; }
  #map { height:42vh; min-height:240px; background:#1d2622; }
  main { padding:12px 16px 28px; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  input, button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:10px 12px; }
  input { width:150px; min-width:0; }
  .devline { color:var(--dim); font-size:12px; margin:-2px 0 10px; }
  button { flex:1; cursor:pointer; }
  button.primary { background:#1f5c3a; border-color:#2f8a57; font-weight:600; }
  button.stop { background:#5c2420; border-color:#8a362f; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .cell .k { color:var(--dim); font-size:12px; }
  .cell .v { font:600 19px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all; }
  .cell .s { color:var(--dim); font-size:12px; }
  .wide { grid-column:1 / -1; }
  .pill { font-size:12px; padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .pill.bad { color:var(--bad); border-color:var(--bad); }
  #msg { margin:10px 0 0; font-size:13px; color:var(--warn); white-space:pre-line; }
  .arrow { width:30px; height:30px; transform-origin:50% 50%; }
</style>
</head>
<body>
<header>
  <h1>PHONE GPS NODE</h1>
  <a href="/ar" style="color:var(--acc);font-size:12px;text-decoration:none">Camera AR ↗</a>
  <span id="netPill" class="pill">IDLE</span>
</header>
<div id="map"></div>
<main>
  <div class="row">
    <input id="dev" value="" placeholder="detecting…" maxlength="32" aria-label="Device ID" title="Device ID (auto: model + unique code, editable)">
    <button id="startBtn" class="primary">Start</button>
    <button id="csvBtn">Save CSV</button>
  </div>
  <div class="devline" id="devName">Device: detecting…</div>
  <div class="grid">
    <div class="cell"><div class="k">Latitude (deg, +N)</div><div class="v" id="lat">—</div></div>
    <div class="cell"><div class="k">Longitude (deg, +E)</div><div class="v" id="lon">—</div></div>
    <div class="cell"><div class="k">Accuracy (m, radius)</div><div class="v" id="acc">—</div><div class="s" id="accQ"></div></div>
    <div class="cell"><div class="k">Heading / Azimuth (deg from N)</div><div class="v" id="hdg">—</div><div class="s" id="hdgSrc"></div></div>
    <div class="cell"><div class="k">Compass heading</div><div class="v" id="cmp">—</div><div class="s" id="cmpS"></div></div>
    <div class="cell"><div class="k">GPS course / Speed</div><div class="v" id="crs">—</div><div class="s" id="spd"></div></div>
    <div class="cell wide"><div class="k">Upload to laptop</div><div class="s" id="tx">Not started</div></div>
  </div>
  <p id="msg"></p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SEND_INTERVAL_MS = 1000;      // 1 Hz, same as firmware GpsPacket
const QUEUE_MAX = 900;              // ~15 min of fixes kept while the laptop is unreachable
const MOVING_MPS = 1.0;             // above this, GNSS course is trusted over the compass

const st = { deviceName:"", watchId:null, compass:null, compassAcc:null, last:null, lastSent:0,
             queue:[], log:[], sent:0, failed:0, wakeLock:null, follow:true,
             running:false, starting:false, generation:0, refreshTimer:null, refreshPending:false };

// ---------------------------------------------------------------- device identity
// Browsers do not expose the phone's own name, so each phone gets "<model>-<4 hex>"
// (e.g. SM-S911N-3fa2, iPhone-7c1e). The code is random and kept in localStorage,
// so two phones on the same hotspot/link never collide and a reload keeps the same ID.
const ID_KEY = "squad_gps_device_id";
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (_) {}
  return null;
}
function randHex(bytes) {
  const a = new Uint8Array(bytes); crypto.getRandomValues(a);
  return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
}
const cleanId = (v) => v.replace(/[^A-Za-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);
async function detectDevice() {
  const ua = navigator.userAgent; let model = "", os = "", m;
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {   // Chrome / Edge / Samsung on Android
      const h = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"]);
      model = (h.model || "").trim();
      if (h.platform) os = h.platform + (h.platformVersion ? " " + h.platformVersion.split(/[._]/)[0] : "");
    }
  } catch (_) {}
  if (!model && (m = ua.match(/Android [\d.]+; ([^;)]+)/)) && m[1].trim() !== "K") model = m[1].replace(/ Build\/.*/, "").trim();
  if (!model && /iPhone/.test(ua)) model = "iPhone";
  if (!model && /iPad/.test(ua)) model = "iPad";
  if (!os) {
    if ((m = ua.match(/OS (\d+)[_\d]* like Mac OS X/))) os = "iOS " + m[1];
    else if ((m = ua.match(/Android (\d+)/))) os = "Android " + m[1];
  }
  if (!model) model = /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Macintosh/.test(ua) ? "Mac" : "Phone";
  return { model, os };
}
const deviceReady = (async () => {
  const d = await detectDevice();
  st.deviceName = [d.model, d.os].filter(Boolean).join(" · ");
  let id = store(ID_KEY);
  if (!id || !/^[A-Za-z0-9_-]{1,32}$/.test(id)) {
    id = `${cleanId(d.model).slice(0, 26) || "Phone"}-${randHex(2)}`;
    store(ID_KEY, id);
  }
  $("dev").value = id;
  $("devName").textContent = `Device: ${st.deviceName}`;
})();
$("dev").addEventListener("change", () => {
  const v = cleanId($("dev").value);
  if (v) { $("dev").value = v; store(ID_KEY, v); }
});

// ---------------------------------------------------------------- map (OSM)
let map = null, marker = null, accCircle = null, trail = null;
function initMap() {
  if (!window.L) { note("Map library could not load (offline). Measuring and upload still work."); return; }
  map = L.map("map", { zoomControl:true }).setView([37.5665, 126.9780], 16);
  const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
  tiles.on("tileerror", () => note("OpenStreetMap tiles unavailable (no internet). Coordinates are still measured."));
  tiles.addTo(map);
  const icon = L.divIcon({ className:"", iconSize:[30,30], iconAnchor:[15,15],
    html:'<svg class="arrow" id="arrow" viewBox="0 0 30 30"><circle cx="15" cy="15" r="6" fill="#62b6ff" stroke="#fff" stroke-width="2"/><path d="M15 1 L20 11 L10 11 Z" fill="#62b6ff" stroke="#fff" stroke-width="1"/></svg>' });
  marker = L.marker([0,0], { icon, interactive:false });
  accCircle = L.circle([0,0], { radius:1, color:"#62b6ff", weight:1, fillOpacity:.12 });
  trail = L.polyline([], { color:"#5fd38d", weight:3, opacity:.8 });
  map.on("dragstart", () => { st.follow = false; });
}
function updateMap(f, heading) {
  if (!map) return;
  const ll = [f.lat, f.lon];
  if (!map.hasLayer(marker)) { marker.addTo(map); accCircle.addTo(map); trail.addTo(map); map.setView(ll, 18); }
  marker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(f.accuracy_m);
  trail.addLatLng(ll);
  const a = document.getElementById("arrow");
  if (a) { a.style.transform = `rotate(${heading ?? 0}deg)`; a.style.opacity = heading == null ? .35 : 1; }
  if (st.follow) map.panTo(ll, { animate:false });
}

// ------------------------------------------------------------- compass
function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onAbsOrientation(e) {                    // Android Chrome: deviceorientationabsolute
  if (e.alpha == null) return;
  st.compass = (360 - e.alpha + screenAngle()) % 360;
}
function onIosOrientation(e) {                    // iOS Safari: webkitCompassHeading (already clockwise from north)
  if (e.webkitCompassHeading == null) return;
  st.compass = (e.webkitCompassHeading + screenAngle()) % 360;
  st.compassAcc = Number.isFinite(e.webkitCompassAccuracy) && e.webkitCompassAccuracy >= 0
    ? e.webkitCompassAccuracy : null;
}
async function startCompass(generation) {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try {                                          // iOS 13+: must be called from a user gesture
      const r = await DeviceOrientationEvent.requestPermission();
      if (generation !== st.generation) return;
      if (r !== "granted") { note("Compass permission denied. Heading will use GPS course while moving only."); return; }
    } catch (err) {
      if (generation === st.generation) note("Compass permission request failed: " + err.message);
      return;
    }
    window.addEventListener("deviceorientation", onIosOrientation, true);
  } else if ("ondeviceorientationabsolute" in window) {
    window.addEventListener("deviceorientationabsolute", onAbsOrientation, true);
  } else {
    note("This browser has no absolute compass. Heading will use GPS course while moving only.");
  }
}
function stopCompass() {
  window.removeEventListener("deviceorientation", onIosOrientation, true);
  window.removeEventListener("deviceorientationabsolute", onAbsOrientation, true);
}

// ------------------------------------------------------------- geolocation
function onPosition(pos) {
  const c = pos.coords;
  const f = {
    device_id: cleanId($("dev").value) || "Phone-" + randHex(2),
    device_name: st.deviceName || null,
    fix_unix_ms: Math.round(pos.timestamp),
    fix_age_ms: Math.max(0, Date.now() - pos.timestamp),
    lat: c.latitude, lon: c.longitude, accuracy_m: c.accuracy,
    heading_gps_deg: Number.isFinite(c.heading) ? c.heading : null,
    heading_compass_deg: st.compass == null ? null : Math.round(st.compass * 10) / 10,
    compass_accuracy_deg: st.compassAcc,
    speed_mps: Number.isFinite(c.speed) ? c.speed : null,
    alt_m: Number.isFinite(c.altitude) ? c.altitude : null,
    alt_accuracy_m: Number.isFinite(c.altitudeAccuracy) ? c.altitudeAccuracy : null,
    alt_reference: "wgs84",
  };
  const moving = f.speed_mps != null && f.speed_mps >= MOVING_MPS;
  let heading = null, src = "none";
  if (moving && f.heading_gps_deg != null) { heading = f.heading_gps_deg; src = "source: GPS course (moving)"; }
  else if (f.heading_compass_deg != null) { heading = f.heading_compass_deg; src = "source: compass"; }
  else if (f.heading_gps_deg != null) { heading = f.heading_gps_deg; src = "source: GPS course"; }
  st.last = f;
  render(f, heading, src);
  updateMap(f, heading);
  const now = Date.now();
  if (now - st.lastSent >= SEND_INTERVAL_MS) { st.lastSent = now; enqueue(f); }
}
function onPosError(err) {
  const why = { 1:"location permission denied", 2:"position unavailable (indoors / weak signal)", 3:"timeout" }[err.code] || err.message;
  note("GPS error: " + why);
  pill(err.code === 1 ? "bad" : "warn", err.code === 1 ? "NO PERMISSION" : "NO FIX");
}
function refreshPosition(generation) {
  if (!st.running || generation !== st.generation || st.refreshPending) return;
  st.refreshPending = true;
  const finish = (callback, value) => {
    if (!st.running || generation !== st.generation) return;
    st.refreshPending = false;
    callback(value);
  };
  navigator.geolocation.getCurrentPosition(
    (pos) => finish(onPosition, pos), (err) => finish(onPosError, err),
    { enableHighAccuracy:true, maximumAge:0, timeout:10000 });
}

// ------------------------------------------------------------- transmit
function enqueue(f) {
  st.log.push(f);
  st.queue.push(f);
  if (st.queue.length > QUEUE_MAX) st.queue.splice(0, st.queue.length - QUEUE_MAX);
  flush();
}
let flushing = false;
async function flush() {
  if (flushing || !st.running) return;
  const generation = st.generation;
  flushing = true;
  try {
    while (st.queue.length && st.running && generation === st.generation) {
      const f = st.queue[0];
      const payload = { ...f, fix_age_ms: Math.max(0, Date.now() - f.fix_unix_ms) };
      const r = await fetch("/api/gps", { method:"POST", headers:{ "Content-Type":"application/json" },
                                           body:JSON.stringify(payload), cache:"no-store" });
      if (!st.running || generation !== st.generation) return;
      if (r.status === 422) { st.queue.shift(); st.failed++; continue; }   // invalid fix: drop, keep going
      if (!r.ok) throw new Error("HTTP " + r.status);
      st.queue.shift(); st.sent++;
    }
    if (st.running && generation === st.generation) pill("ok", "LIVE");
  } catch (e) {
    if (st.running && generation === st.generation) pill("warn", "BUFFERING");
  } finally {
    flushing = false;
    $("tx").textContent = `sent ${st.sent} · queued ${st.queue.length} · invalid ${st.failed} · saved on phone ${st.log.length}`;
  }
}
setInterval(() => { if (st.running && st.queue.length) flush(); }, 3000);

// ------------------------------------------------------------- UI
function fmt(v, d) { return v == null ? "—" : v.toFixed(d); }
function render(f, heading, src) {
  $("lat").textContent = f.lat.toFixed(7);
  $("lon").textContent = f.lon.toFixed(7);
  $("acc").textContent = f.accuracy_m.toFixed(1) + " m";
  $("accQ").textContent = f.accuracy_m <= 10 ? "good" : f.accuracy_m <= 30 ? "fair" : "poor - move outdoors, open sky";
  $("hdg").textContent = heading == null ? "—" : heading.toFixed(1) + "°";
  $("hdgSrc").textContent = src;
  $("cmp").textContent = f.heading_compass_deg == null ? "—" : f.heading_compass_deg.toFixed(1) + "°";
  $("cmpS").textContent = st.compassAcc != null ? `±${st.compassAcc}°` : "top edge of phone";
  $("crs").textContent = f.heading_gps_deg == null ? "—" : f.heading_gps_deg.toFixed(1) + "°";
  $("spd").textContent = f.speed_mps == null ? "speed —" : `${fmt(f.speed_mps, 2)} m/s`;
}
function note(t) { $("msg").textContent = t; }
function pill(cls, t) { const p = $("netPill"); p.className = "pill " + cls; p.textContent = t; }

async function start() {
  if (st.starting || st.running) return;
  const generation = ++st.generation;
  st.starting = true;
  $("startBtn").disabled = true; $("startBtn").textContent = "Starting…";
  $("dev").disabled = true;
  note("");
  try {
    // Safari requires permission to be requested inside the click's activation,
    // before any asynchronous identity detection can consume that activation.
    const compassReady = window.isSecureContext && "geolocation" in navigator
      ? startCompass(generation) : Promise.resolve();
    await deviceReady;
    if (generation !== st.generation) return;
    if (!window.isSecureContext) {
      note("Not HTTPS, so the browser blocks location access.\nOpen https://<laptop-ip>:8443/gps (see README).");
      pill("bad", "NOT HTTPS");
      return;
    }
    if (!("geolocation" in navigator)) { note("This browser does not support Geolocation."); return; }
    await compassReady;
    if (generation !== st.generation) return;
    st.running = true;
    st.lastSent = 0;
    st.watchId = navigator.geolocation.watchPosition(
      (pos) => { if (st.running && generation === st.generation) onPosition(pos); },
      (err) => { if (st.running && generation === st.generation) onPosError(err); },
      { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
    // watchPosition can report only movement on some phones. Acquire a fresh
    // stationary fix explicitly instead of renewing the timestamp of an old fix.
    st.refreshTimer = setInterval(() => refreshPosition(generation), 5000);
    st.follow = true;
    pill("warn", "WAIT FIX");
    $("startBtn").textContent = "Stop"; $("startBtn").className = "stop";
    try {
      const wakeLock = await navigator.wakeLock?.request("screen");
      if (st.running && generation === st.generation) st.wakeLock = wakeLock;
      else wakeLock?.release?.();
    } catch (_) { /* optional */ }
  } finally {
    if (generation === st.generation) {
      st.starting = false;
      $("startBtn").disabled = false;
      if (!st.running) {
        stopCompass();
        $("startBtn").textContent = "Start"; $("startBtn").className = "primary";
        $("dev").disabled = false;
      }
    }
  }
}
function stop() {
  st.running = false; st.starting = false; st.generation++;
  clearInterval(st.refreshTimer); st.refreshTimer = null; st.refreshPending = false;
  if (st.watchId != null) navigator.geolocation.clearWatch(st.watchId);
  st.watchId = null;
  stopCompass();
  st.wakeLock?.release?.(); st.wakeLock = null;
  pill("", "IDLE");
  $("startBtn").textContent = "Start"; $("startBtn").className = "primary";
  $("startBtn").disabled = false;
  $("dev").disabled = false;
}
$("startBtn").addEventListener("click", () => (st.running ? stop() : start()));
$("csvBtn").addEventListener("click", () => {
  const cols = [["device_id","device_id"],["latitude_deg","lat"],["longitude_deg","lon"],["accuracy_m","accuracy_m"],
                ["heading_gps_course_deg","heading_gps_deg"],["heading_compass_deg","heading_compass_deg"],
                ["compass_accuracy_deg","compass_accuracy_deg"],["speed_mps","speed_mps"],["altitude_m","alt_m"],
                ["altitude_accuracy_m","alt_accuracy_m"],["phone_fix_unix_ms","fix_unix_ms"]];
  const lines = [cols.map((c) => c[0]).join(",")].concat(st.log.map((f) => cols.map((c) => f[c[1]] ?? "").join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type:"text/csv" }));
  a.download = `gps_${cleanId($("dev").value) || "phone"}_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;
  a.click();
});
document.addEventListener("visibilitychange", async () => {   // wake lock is dropped when the tab is hidden
  if (document.visibilityState === "visible" && st.watchId != null && (!st.wakeLock || st.wakeLock.released)) {
    const generation = st.generation;
    try {
      const wakeLock = await navigator.wakeLock?.request("screen");
      if (st.running && generation === st.generation) st.wakeLock = wakeLock;
      else wakeLock?.release?.();
    } catch (_) {}
  }
});
initMap();
</script>
</body>
</html>
