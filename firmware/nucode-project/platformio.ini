[env:nucode_nu40]
platform = nordicnrf52@11.0.0
framework = arduino
board = adafruit_feather_nrf52840
; Preserve the working bootloader/upload layout, use the NU40 physical pin map.
board_build.variants_dir = variants
board_build.variant = nu40dk_nrf52840
monitor_speed = 9600
upload_port = /dev/ttyACM*
build_src_flags = -Wall -Wextra -Wno-unused-parameter
